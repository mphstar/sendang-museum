name: Build & Publish to deploy branch

# Setiap push ke main:
# 1. build frontend (npm ci + npm run build) di runner GitHub
# 2. hasil (source + public/build) dipush otomatis ke branch "deploy"
# Hostinger Git menarik dari branch "deploy". Composer dijalankan Hostinger sendiri.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------- FRONTEND BUILD ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ---------- PERSIAPKAN ISI BRANCH DEPLOY ----------
      # Salin source + public/build, buang hal yang tidak perlu untuk server.
      - name: Stage deployment files
        run: |
          mkdir -p /tmp/deploy
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='.env' \
            --exclude='.env.backup' \
            --exclude='.env.production' \
            --exclude='storage/**' \
            --exclude='public/storage/' \
            ./ /tmp/deploy/
          # Hapus .gitignore agar build (public/build) tidak dikecualikan saat commit
          rm -f /tmp/deploy/.gitignore /tmp/deploy/.gitattributes
          # Pastikan asset build ikut
          test -d /tmp/deploy/public/build && echo "public/build siap" || { echo "public/build tidak ditemukan"; exit 1; }

      # ---------- PUSH KE BRANCH DEPLOY ----------
      - name: Publish to deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/deploy
          publish_branch: deploy
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: build ${{ github.sha }}'
