name: Deploy via FTP

# Menjalankan deploy otomatis setiap push ke main.
# Build (composer + npm) dijalankan di runner GitHub, hasilnya (vendor/ + public/build/)
# di-upload ke hosting via FTP. Server TIDAK perlu terminal/npm/composer.

on:
  push:
    branches:
      - main
  workflow_dispatch: # boleh dipicu manual dari tab Actions

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ---------- BACKEND (composer) ----------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # samakan dengan versi PHP di server
          extensions: mbstring, intl, pdo, pdo_sqlite, fileinfo, bcmath, gd, dom, zip
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install composer dependencies (production)
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          composer dump-autoload --no-dev --classmap-authoritative

      # ---------- FRONTEND (npm) ----------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # ---------- BERSIHKAN FILE YANG TIDAK BOLEH DI-UPLOAD ----------
      - name: Remove unwanted files before upload
        run: |
          rm -f .env .env.backup .env.production
          rm -rf node_modules tests storage/framework/cache/data/* storage/framework/sessions/* storage/framework/views/* storage/logs/*.log
          # Beri izin eksekusi pada binary artisan/composer agar tetap berfungsi
          chmod +x artisan

      # ---------- UPLOAD VIA FTP ----------
      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ${{ secrets.FTP_PROTOCOL }} # ftp | ftps | sftp
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*/**
            **/node_modules/**
            .env*
            storage/**
            public/storage/**
