name: Deploy via SSH (Git Pull)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-22} \
            -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile=/dev/null \
            ${SSH_USERNAME}@${SSH_HOST} "
              set -e
              cd /home/u133764157/domains/sendang.j-dims.com/public_html

              echo \"--> Fetching latest code...\"
              git fetch https://${GH_PAT}@github.com/mphstar/sendang-museum.git main
              git reset --hard FETCH_HEAD

              if command -v composer &> /dev/null; then
                echo \"--> Updating composer dependencies...\"
                composer install --no-dev --prefer-dist --optimize-autoloader || true
              fi

              if command -v npm &> /dev/null; then
                echo \"--> Building frontend assets...\"
                npm install || true
                npm run build || true
              fi

              echo \"--> Running database migrations...\"
              php artisan migrate --force

              echo \"--> Clearing and optimizing cache...\"
              php artisan config:clear
              php artisan cache:clear
              php artisan route:clear
              php artisan view:clear
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache

              echo \"--> Deploy completed successfully!\"
            "

